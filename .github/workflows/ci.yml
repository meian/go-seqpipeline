name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [gofmt, build, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false
      - name: gofmt
        if: matrix.check == 'gofmt'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: go build
        if: matrix.check == 'build'
        run: go build ./...
      - name: go test
        if: matrix.check == 'test'
        run: go test ./... -count=1

  lint:
    name: Static checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-golangci-lint@216f5c6023089bd277ce168ff7560607ce524658 # v2.10.2
        with:
          golangci_lint_version: v2.15.0
          reviewdog_version: v0.21.2
          go_version_file: go.mod
          tool_name: golangci-lint
          reporter: github-pr-review
          filter_mode: added
          fail_level: error
          cache: false
          # Checkstyle で指摘ごとの重大度を reviewdog へ渡す。
          golangci_lint_flags: >-
            --output.text.path=/dev/null
            --output.checkstyle.path=stdout
            ./...
          reviewdog_flags: -f=checkstyle

  readme:
    name: README policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install README guard dependencies
        run: python3 -m pip install -r ci/scripts/requirements.txt
      - name: Test CI scripts
        run: python3 -m unittest discover -s ci/scripts -p 'test_*.py'
      - name: Check both READMEs
        run: python3 ci/scripts/check_readme.py
